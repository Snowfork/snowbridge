[SERVICE]
    Flush          1
    Daemon         Off
    Log_Level      info
    Parsers_File   /fluent-bit/parsers/parsers.conf

[INPUT]
    Name           forward
    Listen         0.0.0.0
    Port           24224

[FILTER]
    Name           parser
    Match          *
    Key_Name       log
    Parser         json
    Reserve_Data   On

[FILTER]
    Name           record_modifier
    Match          beacon-state-service
    Record         service beacon-state-service

[FILTER]
    Name           record_modifier
    Match          beacon-relay
    Record         service beacon-relay

[FILTER]
    Name           record_modifier
    Match          ethereum-v2-relay
    Record         service ethereum-v2-relay

[FILTER]
    Name           record_modifier
    Match          ethereum-relay
    Record         service ethereum-relay

[FILTER]
    Name           record_modifier
    Match          parachain-v3-relay
    Record         service parachain-v3-relay

[FILTER]
    Name           record_modifier
    Match          reward-relay
    Record         service reward-relay

[OUTPUT]
    Name              cloudwatch_logs
    Match             beacon-state-service
    region            ${AWS_REGION}
    log_group_name    snowbridge/${ENVIRONMENT}
    log_stream_name   beacon-state-service
    auto_create_group true

[OUTPUT]
    Name              cloudwatch_logs
    Match             beacon-relay
    region            ${AWS_REGION}
    log_group_name    snowbridge/${ENVIRONMENT}
    log_stream_name   beacon-relay
    auto_create_group true

[OUTPUT]
    Name              cloudwatch_logs
    Match             ethereum-v2-relay
    region            ${AWS_REGION}
    log_group_name    snowbridge/${ENVIRONMENT}
    log_stream_name   ethereum-v2-relay
    auto_create_group true

[OUTPUT]
    Name              cloudwatch_logs
    Match             ethereum-relay
    region            ${AWS_REGION}
    log_group_name    snowbridge/${ENVIRONMENT}
    log_stream_name   ethereum-relay
    auto_create_group true

[OUTPUT]
    Name              cloudwatch_logs
    Match             parachain-v3-relay
    region            ${AWS_REGION}
    log_group_name    snowbridge/${ENVIRONMENT}
    log_stream_name   parachain-v3-relay
    auto_create_group true

[OUTPUT]
    Name              cloudwatch_logs
    Match             reward-relay
    region            ${AWS_REGION}
    log_group_name    snowbridge/${ENVIRONMENT}
    log_stream_name   reward-relay
    auto_create_group true
