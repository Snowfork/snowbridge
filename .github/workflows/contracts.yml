name: contracts

on:
  push:
    paths:
      - "contracts/**"
      - "!contracts/**/README.md"
    branches:
      - main
  pull_request:
    paths:
      - "contracts/**"
      - "!contracts/**/README.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: snowbridge-runner
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v1
        with:
          fetch-depth: 2
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Test
        working-directory: contracts
        run: forge test
      - name: Test assembly against its references on the deployed build
        working-directory: contracts
        run: >-
          FOUNDRY_PROFILE=production forge test --match-path
          'test/{BitfieldEquivalence,SubstrateMerkleProofAssembly,BeefyClientCompactAttack}.t.sol'
      - name: Coverage
        working-directory: contracts
        run: forge coverage --exclude-tests --report=lcov
      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@v5
        with:
          working-directory: contracts
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: solidity
